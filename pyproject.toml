# Скрипты генерации данных (tools/). Пакета тут нет и зависимостей тоже -
# только стандартная библиотека, поэтому в файле лежат одни настройки ruff.

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["tools"]

[tool.ruff.lint]
select = [
  "F",   # ошибки: неиспользованное, опечатки в именах
  "E",   # стиль из pycodestyle
  "W",
  "I",   # порядок импортов
  "UP",  # устаревшие конструкции
  "B",   # ловушки вроде замыкания на переменную цикла
  "SIM", # упрощения
  "C4",  # генераторы вместо лишних списков
]
ignore = [
  # таблицы правил игры и веса статов читаются глазами по колонкам,
  # поэтому лямбда в словаре тут нагляднее вложенного def
  "E731",
  # отладочный вывод свёрстан колонками ('%-14s %-42s %5.0f'), и в этом виде
  # он читается лучше, чем те же ширины, размазанные по f-строке
  "UP031",
]

[tool.ruff.lint.isort]
known-first-party = ["bis", "faction"]
